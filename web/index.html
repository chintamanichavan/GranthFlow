<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GranthFlow</title>
  <meta name="description" content="A reader for books, papers and notes. Everything stays on your device.">
  <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GranthFlow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon_256.png" sizes="256x256" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon_256.png">
  <link rel="stylesheet" href="./app/style.css">
</head>
<body>
  <header class="bar"><h1>GranthFlow</h1></header>
  <main>
    <div class="empty">
      <h2>Opening the engine…</h2>
      <p class="hint">Reading PDF, EPUB, Markdown and text with the same C++ engine the Mac app uses.</p>
    </div>
  </main>
  <noscript>
    <p style="padding: 20px">GranthFlow reads your files in the browser itself, which needs JavaScript. Nothing is uploaded either way.</p>
  </noscript>
  <script type="module" src="./app/main.js"></script>
</body>
</html>
